spring.application.name=reservas

spring.datasource.url=jdbc:postgresql://localhost:5440/reservas
spring.datasource.username=reservas
spring.datasource.password=reservas

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

reservas.cancelacion.horas-minimas=24

reservas.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-cambiar-en-produccion-0123456789}
reservas.jwt.expiracion-minutos=60

reservas.finalizacion.cron=0 */5 * * * *

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50