services:
  db:
    image: postgres:16
    container_name: reservas-db
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
    ports:
      - "5440:5432"
    volumes:
      - reservas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/reservas
      DB_USER: reservas
      DB_PASSWORD: reservas
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "8080:8080"

volumes:
  reservas-data: